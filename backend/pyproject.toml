[project]
name = "contact-backend"
version = "0.1.0"
description = "企业通讯录管理系统后端"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "email-validator>=2.1.0",
  "python-multipart>=0.0.6",
  "openpyxl>=3.1.0",
  "pandas>=2.1.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.19.0",
]

[project.scripts]
backend = "app.main:app"

[tool.uv]
dev-dependencies = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
