[project]
name = "dag-scheduler-backend"
version = "0.1.0"
description = "DAG Scheduler Backend - Airflow-like task management system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "croniter>=2.0.5",
    "websockets>=13.1",
    "alembic>=1.13.0",
]

[project.scripts]
start-backend = "app.main:start_server"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
